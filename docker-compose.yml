services:
  redis-server:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]

  redis-insight:
    image: redis/redisinsight:latest
    ports:
      - "8001:8001"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
        - REDIS_URL=redis://redis-server:6379/0
        - LOCUST_WEB_URL=http://locust:8089
    depends_on:
      - redis-server
    volumes:
        - .:/app

  locust:
    build:
      context: .
      dockerfile: Dockerfile.locust
    ports:
      - "8089:8089"
    environment:
      - TARGET_HOST=http://backend:8000
    depends_on:
      - backend

volumes:
  redis_data: