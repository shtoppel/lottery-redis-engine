<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redis High-Load System</title>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>

  <div class="stats-container">
    <div class="stat-box">TOTAL TICKETS<span id="total-counter" class="stat-value">0</span></div>
    <div class="stat-box">LOAD (RPS)<span id="rps-counter" class="stat-value">0</span></div>
    <div class="stat-box">REDIS MEMORY<span id="redis-mem-val" class="stat-value blue">0 MB</span></div>
    <div class="stat-box">SYS RAM<span id="sys-mem-val" class="stat-value blue">0%</span></div>
    <div class="stat-box">PROGRESS<span id="progress-percent" class="stat-value">0%</span></div>
  </div>

  <div class="top-progress">
    <div id="progress-bar"></div>
  </div>

  <div class="main-panel">
    <h1>High-Load Simulator <small class="version-tag">v2.1.0</small></h1>

    <div class="generator-section">
      <label id="gen-label">1. CONFIGURE PARTICIPANTS POOL:</label>
      <div class="control-row">
        <input type="number" id="participants" value="100000" class="participants-input" />
        <button id="btn-gen-python">Python</button>
        <button id="btn-gen-lua" class="lua-btn">Lua Turbo</button>
        <button id="btnRunDemo" class="btn-cyan">Run Demo Ramp Test</button>
        <button id="btn-clear" class="btn-danger flex-1">Reset Simulation</button>
      </div>

      <div id="benchmark-result" class="status-msg">
        Last: <span id="timer-val">0.000</span>s | <span id="eff-rps">0</span> RPS
      </div>

      <hr class="hr" />

      <label class="label-blue">OFFICIAL DRAW (ADMIN)</label>
      <div class="control-row">
        <button id="btn-draw" class="lua-btn w-100">⚡ PERFORM OFFICIAL DRAW ⚡</button>
      </div>

      <div class="winner-wrap mt-10">
        <span id="winner-display" class="winner-display">NOT DRAWN</span>
      </div>

      <hr class="hr" />

      <label class="label-blue">SCENARIOS (UI CONTROL)</label>

      <div class="control-row">
        <button id="btn-burst-5000" class="lua-btn flex-1">Run Burst 5000</button>
        <button id="btn-burst-2000" class="lua-btn flex-1">Run Burst 2000</button>
      </div>

      <div class="control-row">
        <button id="btn-steady" class="flex-1">Run Steady 2000</button>
        <button id="btn-scenario-stop" class="btn-danger flex-1">Stop Scenario</button>
      </div>

      <hr class="hr" />

      <label>YOUR CURRENT TICKET:</label>
      <div id="user-numbers" class="numbers-display">
        <span>XX</span><span>XX</span><span>XX</span><span>XX</span>
        <span>XX</span><span>XX</span><span>XX</span><span>XX</span>
      </div>

      <div id="ticket-status" class="status-msg centered mb-10"></div>

      <div class="ticket-actions">
        <button id="btn-pull-verify" class="lua-btn flex-1">2. PULL + VERIFY (1 TICKET)</button>
      </div>

      <label>MASS VALIDATION (MIN 10,000):</label>
      <div class="control-row">
        <input type="number" id="multi-count" value="10000" min="10000" step="1000" class="multi-count-input" />
        <button id="btn-multi" class="lua-btn">Multi-Check Lua</button>
      </div>

      <div id="multi-results" class="status-msg">> Ready...</div>
      <div id="game-status" class="status-msg">> Awaiting commands...</div>
    </div>

    <!-- Right panel is loaded dynamically -->
    <div id="control-panel-slot"></div>
  </div>

  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
